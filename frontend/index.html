<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Fake News Detection</h1>
            <p>Enter the news text below to check if it's real or fake.</p>
        </header>

        <div class="form-container">
            <textarea id="newsText" placeholder="Paste the news text here..."></textarea>
            <button onclick="checkFakeNews()">Check News</button>
        </div>

        <div class="result" id="result">
            <!-- Result will appear here -->
        </div>

        <footer>
            <p>Powered by Fake News Detection App</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
