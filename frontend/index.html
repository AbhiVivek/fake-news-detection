<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fake News Detector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      text-align: center;
    }
    textarea {
      width: 80%;
      height: 100px;
      padding: 10px;
      margin-top: 20px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      margin-top: 20px;
      font-size: 18px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    .result {
      margin-top: 30px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>📰 Fake News Detection</h1>
  <textarea id="newsInput" placeholder="Paste your news text here..."></textarea><br/>
  <button onclick="checkNews()">Check</button>

  <div class="result" id="result"></div>

  <script>
    async function checkNews() {
      const text = document.getElementById('newsInput').value;
      const resultDiv = document.getElementById('result');
      resultDiv.innerText = 'Checking...';

      try {
        const response = await fetch('https://fake-news-detection-romh.onrender.com/predict', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ text })
        });

        const data = await response.json();
        if (data.prediction) {
          resultDiv.innerText = `🧐 Prediction: ${data.prediction}`;
        } else if (data.error) {
          resultDiv.innerText = `⚠️ Error: ${data.error}`;
        } else {
          resultDiv.innerText = '❌ Unexpected response';
        }
      } catch (err) {
        resultDiv.innerText = `❌ Request failed: ${err.message}`;
      }
    }
  </script>
</body>
</html>
